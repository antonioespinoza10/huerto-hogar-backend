spring.application.name=huerto-hogar-backend
server.port=8080

# ---------- Base de datos MySQL ----------
# La base "huertohogar" se crea sola si no existe. Usuario y clave se pueden cambiar
# con las variables de entorno DB_USER y DB_PASSWORD (en XAMPP, root sin clave).
spring.datasource.url=jdbc:mysql://localhost:3306/huertohogar?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Clave secreta en Base64 (mínimo 256 bits). En producción se reemplaza con la variable JWT_SECRET.
app.jwt.secret=${JWT_SECRET:sY7OExJO4hAntF/yB0hf4uuyzOt/1T5yzYPUqefwjf+UKLOUjJIqkiHiIeiO2jav}
app.jwt.expiracion-minutos=60
app.jwt.refresh-dias=7

# ---------- CORS: dirección del frontend React ----------
app.cors.origenes=http://localhost:5173,http://127.0.0.1:5173

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
